- inputText:
    text: "${SEARCH_USERNAME}"

- assertVisible:
    text: "Users"

- back

- tapOn:
    id: "AddPostButton"

- assertVisible:
    text: "Inspire and" # Verification on Feed screen or CreatePost modal
